name: Deploy to Serverpod Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Serverpod Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Install Serverpod Cloud CLI
        run: |
          dart pub global activate serverpod_cloud_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Deploy to Serverpod Cloud
        working-directory: alnur_store_server
        run: |
          scloud deploy --token "${{ secrets.SERVERPOD_CLOUD_TOKEN }}"
