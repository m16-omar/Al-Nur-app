# Template passwords file for Al-Nur Store Serverpod Backend.
# Copy this file to config/passwords.yaml and populate your credentials.
# NEVER commit config/passwords.yaml with real secrets to version control.

shared:
  smtpEmail: 'your_email@gmail.com'
  smtpAppPassword: 'your_google_app_password'
  geminiApiKey: 'your_gemini_api_key'

  # Cloudflare R2 Storage Configuration
  r2AccountId: 'your_32_character_account_id'
  r2Bucket: 'alnur-store'
  r2PublicHost: 'pub-xxxxxxxxxxxxxx.r2.dev' # Or custom domain e.g. 'cdn.alnurstore.com'
  R2AccessKeyId: 'your_r2_access_key_id'
  R2SecretKey: 'your_r2_secret_access_key'

development:
  database: 'your_dev_database_password'
  redis: 'your_dev_redis_password'
  serviceSecret: 'your_dev_service_secret'
  emailSecretHashPepper: 'your_dev_pepper'
  jwtHmacSha512PrivateKey: 'your_dev_jwt_key'
  jwtRefreshTokenHashPepper: 'your_dev_refresh_pepper'

test:
  database: 'your_test_database_password'
  redis: 'your_test_redis_password'
  emailSecretHashPepper: 'your_test_pepper'
  jwtHmacSha512PrivateKey: 'your_test_jwt_key'
  jwtRefreshTokenHashPepper: 'your_test_refresh_pepper'

staging:
  database: 'your_staging_database_password'
  serviceSecret: 'your_staging_service_secret'
  emailSecretHashPepper: 'your_staging_pepper'
  jwtHmacSha512PrivateKey: 'your_staging_jwt_key'
  jwtRefreshTokenHashPepper: 'your_staging_refresh_pepper'

production:
  database: 'your_prod_database_password'
  serviceSecret: 'your_prod_service_secret'
  emailSecretHashPepper: 'your_prod_pepper'
  jwtHmacSha512PrivateKey: 'your_prod_jwt_key'
  jwtRefreshTokenHashPepper: 'your_prod_refresh_pepper'
