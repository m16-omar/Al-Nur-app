services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: alnur_store
      POSTGRES_PASSWORD: "FvHhQLQ0jc8FC2QPCDdg-idkxAghPjQm"
    volumes:
      - alnur_store_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "2HadngFR-j5e6zo9b4e377Z6lpy2X2_w"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: alnur_store_test
      POSTGRES_PASSWORD: "4pGjodP3TN9syH2UDTlT-1a4ES3AYA_V"
    volumes:
      - alnur_store_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "zSKCAsbAzcvWkc9vLHgDHHyiN9JO9xXz"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  alnur_store_data:
  alnur_store_test_data:
